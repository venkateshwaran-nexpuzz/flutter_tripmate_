
workflows:
  tripmate-ios:
    name: TripMate iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS app
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
