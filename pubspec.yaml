name: tripmate_app
description: TripMate Bus Attendance Management System - Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # HTTP client
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Local database (offline storage)
  sqflite: ^2.3.0

  # Connectivity
  connectivity_plus: ^6.1.3

  # GPS / Location
  geolocator: ^11.0.0

  # QR code scanning & generation
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Push notifications (stub)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  logger: ^2.0.2+1

  # Voice Recording (Driver Day Report)
  record: ^5.1.2
  audio_session: ^0.1.21
  audioplayers: ^6.8.1
  google_mlkit_text_recognition: ^0.17.1
  flutter_tts: ^4.2.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
